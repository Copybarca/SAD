spring.application.name=auto-dev-app
server.port=${APP_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_APP_DB:auto_dev_app}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_ADMIN_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_ADMIN_PASSWORD:postgres}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.database.admin-url=${POSTGRES_ADMIN_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_ADMIN_DB:postgres}}
app.database.admin-username=${POSTGRES_ADMIN_USER:postgres}
app.database.admin-password=${POSTGRES_ADMIN_PASSWORD:postgres}
app.database.name=${POSTGRES_APP_DB:auto_dev_app}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
