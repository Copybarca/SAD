services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    ports:
      - 127.0.0.1:${POSTGRES_EXPOSED_PORT:-65432}:5432
    volumes:
      - auto_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_ADMIN_DB:-postgres}
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    environment:
      APP_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_DB: ${POSTGRES_ADMIN_DB:-postgres}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-auto_dev_app}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_APP_DB:-auto_dev_app}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_ADMIN_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      POSTGRES_ADMIN_URL: jdbc:postgresql://postgres:5432/${POSTGRES_ADMIN_DB:-postgres}
    ports:
      - ${APP_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  auto_dev_postgres_data:
